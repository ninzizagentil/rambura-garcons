services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # Published on this computer ONLY (127.0.0.1), never to the network: lets you run the seed script or
    # MongoDB Compass from the server itself. The backend container reaches it as mongo:27017.
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: rambura_garcons
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # These win over backend/.env, so a development .env can never switch the live site to development mode.
      NODE_ENV: production
      TRUST_PROXY: "1" # the API sits behind the nginx container
      MONGODB_URI: mongodb://mongo:27017/rambura_garcons
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      BACKUP_DIR: /app/backups
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads
      - backend-backups:/app/backups
    expose:
      - "5000"

  frontend:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  backend-uploads:
  backend-backups:
