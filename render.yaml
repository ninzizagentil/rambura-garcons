services:
  - type: web
    name: rambura-garcons
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI_PRODUCTION
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: rambura-garcons-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: rambura-garcons-api
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rambura-garcons
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html